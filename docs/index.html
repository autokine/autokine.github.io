<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinesis</title>
<meta name="description" content="Kinesis — something in motion.">
<style>
  :root{
    --cream:#F5F4EE;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --coral:#D97757;
    --coral-soft:#F0C4B3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
    position:relative;
  }

  .orbit{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .dot{
    position:absolute;
    border-radius:50%;
    background:var(--coral);
    opacity:.55;
    animation:drift 14s ease-in-out infinite;
  }
  .dot:nth-child(1){width:14px;height:14px;top:18%;left:12%;animation-delay:0s;background:var(--coral);}
  .dot:nth-child(2){width:9px;height:9px;top:70%;left:20%;animation-delay:2.4s;background:var(--coral-soft);}
  .dot:nth-child(3){width:20px;height:20px;top:26%;left:82%;animation-delay:4.8s;background:var(--coral-soft);}
  .dot:nth-child(4){width:11px;height:11px;top:78%;left:78%;animation-delay:1.2s;background:var(--coral);}
  .dot:nth-child(5){width:7px;height:7px;top:50%;left:6%;animation-delay:3.6s;background:var(--coral);}
  .dot:nth-child(6){width:16px;height:16px;top:8%;left:55%;animation-delay:6s;background:var(--coral-soft);}

  @keyframes drift{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(0,-22px);}
  }

  main{
    position:relative;
    text-align:center;
    padding:2rem;
    max-width:34rem;
  }

  .mark{
    width:52px;
    height:52px;
    margin:0 auto 1.75rem;
    border-radius:50%;
    background:var(--coral);
    position:relative;
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }

  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:clamp(2.4rem,7vw,3.6rem);
    font-weight:400;
    letter-spacing:-0.01em;
    margin:0 0 0.9rem;
  }

  p.tagline{
    font-size:1.1rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 2.2rem;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    padding:0.7rem 1.4rem;
    border-radius:999px;
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    text-decoration:none;
    font-size:0.95rem;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .cta:hover{
    background:var(--ink);
    color:var(--cream);
    transform:translateY(-1px);
  }
  .cta svg{transition:transform .2s ease;}
  .cta:hover svg{transform:translateX(2px);}

  footer{
    position:absolute;
    bottom:1.75rem;
    left:0;
    right:0;
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    opacity:.7;
  }

  @media (prefers-reduced-motion: reduce){
    .dot, .mark{animation:none;}
  }
</style>
</head>
<body>

  <div class="orbit" aria-hidden="true">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Kinesis</h1>
    <p class="tagline">Something in motion. We're building — come back soon,<br>or say hello in the meantime.</p>
    <a class="cta" href="mailto:contact@kinesis.md">
      Get in touch
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </main>

  <footer>&copy; 2026 Kinesis</footer>

</body>
</html>
